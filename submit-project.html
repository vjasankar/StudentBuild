<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Project | StudentBuild</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body style="visibility: hidden;">

    <header class="dashboard-header">

        <div class="dashboard-logo">
            <h2>StudentBuild</h2>
        </div>

        <div class="dashboard-user">

            <a href="dashboard.html" class="dashboard-button secondary">
                Dashboard
            </a>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

    </header>


    <main class="submit-container">

        <div class="submit-header">

            <h1>Submit Your Project 🚀</h1>

            <p>
                Tell us about your project idea and our technical team
                will review your requirements.
            </p>

        </div>


        <form id="projectForm" class="project-form">

            <div class="form-group">

                <label for="title">
                    Project Title
                </label>

                <input type="text" id="title" placeholder="Example: Smart Attendance System" required>

            </div>


            <div class="form-group">

                <label for="description">
                    Project Description
                </label>

                <textarea id="description" rows="6"
                    placeholder="Explain your project idea, main features and what you want to build..."
                    required></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select id="department" required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="CSE">
                            CSE
                        </option>

                        <option value="ECE">
                            ECE
                        </option>

                        <option value="EEE">
                            EEE
                        </option>

                        <option value="MECH">
                            Mechanical
                        </option>

                        <option value="CIVIL">
                            Civil
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="domain">
                        Project Domain
                    </label>

                    <select id="domain" required>

                        <option value="">
                            Select Domain
                        </option>

                        <option value="AI/ML">
                            AI / ML
                        </option>

                        <option value="Web Development">
                            Web Development
                        </option>

                        <option value="App Development">
                            App Development
                        </option>

                        <option value="IoT">
                            IoT
                        </option>

                        <option value="Data Science">
                            Data Science
                        </option>

                        <option value="Embedded Systems">
                            Embedded Systems
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="projectType">
                        Project Type
                    </label>

                    <select id="projectType" required>

                        <option value="">
                            Select Type
                        </option>

                        <option value="Mini Project">
                            Mini Project
                        </option>

                        <option value="Major Project">
                            Major Project
                        </option>

                        <option value="Prototype">
                            Prototype
                        </option>

                        <option value="Hackathon">
                            Hackathon
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="budget">
                        Budget Range
                    </label>

                    <select id="budget">

                        <option value="">
                            Select Budget
                        </option>

                        <option value="Below ₹5,000">
                            Below ₹5,000
                        </option>

                        <option value="₹5,000 - ₹10,000">
                            ₹5,000 - ₹10,000
                        </option>

                        <option value="₹10,000 - ₹25,000">
                            ₹10,000 - ₹25,000
                        </option>

                        <option value="₹25,000+">
                            ₹25,000+
                        </option>

                        <option value="Not decided">
                            Not decided
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="deadline">
                    Expected Deadline
                </label>

                <input type="date" id="deadline">

            </div>


            <p id="projectMessage" class="auth-message"></p>


            <button type="submit" class="auth-button project-submit-button">
                Submit Project
            </button>

        </form>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>
    <script src="submit-project.js"></script>

</body>

</html>
