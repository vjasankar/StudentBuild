<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile | StudentBuild</title>
    <link rel="icon" type="image/png" href="assets/logo/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card" style="max-width: 520px;">

            <div class="auth-logo">
                <img src="assets/logo/studentbuild-mark.png" alt="StudentBuild Logo" style="width: 52px; height: 52px; object-fit: contain; margin: 0 auto 12px; display: block;">
                <h1>StudentBuild</h1>
                <p>Your Project. Our Technical Support.</p>
            </div>

            <h2>Complete Your Profile</h2>
            <p class="auth-subtitle">
                Just a few more details before you start your project journey.
            </p>

            <form id="completeProfileForm">

                <!-- Name -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Your full name" readonly style="opacity: 0.85; background: rgba(255, 255, 255, 0.03);">
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Your email address" readonly style="opacity: 0.85; background: rgba(255, 255, 255, 0.03);">
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your 10-digit phone number" maxlength="10" pattern="[0-9]{10}" required>
                </div>

                <!-- College -->
                <div class="form-group">
                    <label for="college">College Name</label>
                    <input type="text" id="college" placeholder="Enter your college name" required>
                </div>

                <!-- Department & Year -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" placeholder="Example: CSE, ECE" required>
                    </div>

                    <div class="form-group">
                        <label for="year">Year of Study</label>
                        <select id="year" required>
                            <option value="">Select your year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                </div>

                <p id="profileMessage" class="auth-message"></p>

                <button type="submit" class="auth-button">
                    Complete Profile ➔
                </button>

            </form>

            <p class="back-home">
                <a href="index.html">← Back to Home</a>
            </p>

        </div>

    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>
    <script src="complete-profile.js"></script>

</body>

</html>
