<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StudentBuild</title>
    <link rel="icon" type="image/png" href="assets/logo/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <img src="assets/logo/studentbuild-mark.png" alt="StudentBuild Logo" style="width: 52px; height: 52px; object-fit: contain; margin: 0 auto 12px; display: block;">
                <h1>StudentBuild</h1>
                <p>Your Project. Our Technical Support.</p>
            </div>

            <h2>Welcome Back</h2>
            <p class="auth-subtitle">
                Login to continue to your StudentBuild portal.
            </p>

            <!-- Email / Password Login -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <p id="loginMessage" class="auth-message"></p>

                <button type="submit" class="auth-button">
                    Login to Account ➔
                </button>

            </form>

            <!-- Divider -->
            <div class="auth-divider">
                <span>OR</span>
            </div>

            <!-- Google Login -->
            <button type="button" id="googleLoginButton" class="google-login-button">
                <span class="google-icon">G</span>
                <span>Continue with Google</span>
            </button>

            <p class="auth-footer">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

            <p class="back-home">
                <a href="index.html">← Back to Home</a>
            </p>

        </div>

    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>
    <script src="login.js"></script>

</body>

</html>
